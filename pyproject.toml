# Formatting, lint and type-check configuration — agent-cycle project
#
# The rules are check_rst's and check_formatting's common set, so the three
# repositories format and lint Python alike.

[tool.ruff]
line-length = 120
target-version = "py314"
required-version = "==0.16.9"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "UP", "I", "RUF", "SIM", "PT", "ANN", "TCH"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
